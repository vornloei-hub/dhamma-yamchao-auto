name: Dhamma Yamchao Auto 06:00
on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 06:00 เวลาไทย
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ทดสอบสร้างวิดีโออย่างเดียว ไม่โพสต์ (1 = ไม่โพสต์)'
        default: '0'
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-thai-tlwg libraqm0
      - name: Install Python packages
        run: pip install requests pillow pythainlp edge-tts gTTS
      - name: Create video and post to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python Dhamma-Yamchao-Auto.py
      - name: Keep video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhamma-video
          path: out/dhamma.mp4
          retention-days: 3
