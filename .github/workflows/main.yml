  name: Dhamma Yamchao Auto 06:00
  on:
    schedule:
      - cron: '0 23 * * *'
    workflow_dispatch:
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - name: Send to Make
          env:
            MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: python Dhamma-Yamchao-Auto.py
